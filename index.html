<!doctype html>
<html lang="pt-BR" data-tema="noite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IMP Digital · ERP</title>
<meta name="theme-color" content="#0A0B0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IMP Digital">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon-v1.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#0A0B0F;--bg2:#0F1117;--card:#151821;--card2:#1B1F2A;--card3:#222736;--linha:#252A37;--linha2:#323849;
  --tx:#F2F0EA;--mut:#9AA0AE;--mut2:#6B7180;
  --acc:#FF7A59;--acc2:#6FD3C7;--gold:#F2C14E;--lil:#B9A6FF;
  --ok:#5FD39A;--warn:#FFB547;--bad:#FF5C6C;
  --acc-tx:#1A0D08;
  --side:236px;--rail:300px;--r:14px;
  --fb:Figtree,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --fd:"Instrument Serif",Georgia,serif;
  color-scheme:dark;
}
html[data-tema=areia]{
  --bg:#F4F1EB;--bg2:#ECE8E0;--card:#FFFFFF;--card2:#F6F3EE;--card3:#EEE9E1;--linha:#E3DED4;--linha2:#D3CCBF;
  --tx:#17181D;--mut:#5F6370;--mut2:#8C909A;--acc:#E35F3C;--acc2:#2E9C90;--gold:#B8861B;--lil:#6E55D8;--acc-tx:#fff;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;background:var(--bg);color:var(--tx)}
body{font:13px/1.45 var(--fb);-webkit-font-smoothing:antialiased;min-height:100vh}
[hidden]{display:none!important}
a{color:var(--acc);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--tx)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mut{color:var(--mut)}.mut2{color:var(--mut2)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.accc{color:var(--acc)}
.num{font-variant-numeric:tabular-nums}
.sm{font-size:11.5px}.xs{font-size:10.5px}
.b{font-weight:700}
.row{display:flex;align-items:center;gap:8px}.row.w{flex-wrap:wrap}.sp{flex:1}
.col{display:flex;flex-direction:column;gap:8px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg2);border-right:1px solid var(--linha);padding:18px 12px 14px;display:flex;flex-direction:column;gap:2px}
.brand{padding:2px 10px 16px}
.logo{display:flex;align-items:baseline;gap:6px;font-weight:900;font-size:25px;letter-spacing:-.04em;line-height:1}
.logo .dg{font-family:var(--fd);font-style:italic;font-weight:400;font-size:24px;color:var(--acc);letter-spacing:0}
.logo .rj{font-size:9.5px;font-weight:800;letter-spacing:.12em;border:1px solid var(--linha2);border-radius:99px;padding:2px 6px;color:var(--mut);align-self:center}
.brand p{color:var(--mut2);font-size:11px;margin-top:6px}
.ngrp{font-size:9.5px;letter-spacing:.16em;color:var(--mut2);font-weight:700;padding:14px 10px 6px;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;color:var(--mut);text-align:left;width:100%;position:relative}
.nav:hover{background:var(--card);color:var(--tx)}
.nav.on{background:var(--acc);color:var(--acc-tx)}
.nav .lb{display:flex;flex-direction:column;line-height:1.15}
.nav .lb b{font-weight:600;font-size:13px}
.nav .lb i{font-style:normal;font-size:10px;opacity:.6}
.nav .bdg{margin-left:auto;font-size:10px;font-weight:800;background:var(--card3);color:var(--tx);border-radius:99px;padding:1px 7px}
.nav.on .bdg{background:rgba(0,0,0,.18);color:inherit}
.sidefoot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--linha);font-size:11.5px;color:var(--mut)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 22px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linha)}
.srch{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--linha);border-radius:99px;padding:8px 14px;color:var(--mut);position:relative}
.srch input{flex:1;background:none;border:0;outline:0;min-width:0}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--linha2);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.45);max-height:420px;overflow:auto;padding:6px;z-index:40}
.sres button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:9px;text-align:left}
.sres button:hover,.sres button.hl{background:var(--card2)}
.sres .tg{font-size:10px;color:var(--mut2);min-width:62px;text-transform:uppercase;letter-spacing:.08em}
.chipd{display:flex;align-items:center;gap:6px;border:1px solid var(--linha);border-radius:99px;padding:7px 12px;font-weight:600;font-size:12px;background:var(--card)}
.ib{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;border:1px solid var(--linha);background:var(--card);position:relative}
.ib .dot{position:absolute;top:-3px;right:-3px;background:var(--acc);color:var(--acc-tx);font-size:9.5px;font-weight:800;border-radius:99px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.me{display:flex;align-items:center;gap:8px}
.av{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--acc);color:var(--acc-tx);flex:none}
.av.s{width:24px;height:24px;font-size:10px}
.me b{display:block;font-size:12.5px;line-height:1.1}.me span{font-size:10.5px;color:var(--mut)}
.body{display:grid;grid-template-columns:1fr var(--rail);gap:18px;padding:18px 22px 40px;align-items:start}
.body.full{grid-template-columns:1fr}
.content{min-width:0;display:flex;flex-direction:column;gap:16px}
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:76px}

/* ---------- componentes ---------- */
.card{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:14px 16px}
.card.p0{padding:0}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ch h3{font-size:13.5px;font-weight:700}
.ch .lk{margin-left:auto;font-size:11.5px;color:var(--mut)}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h1{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.ph .sub{color:var(--mut);font-size:12px;margin-top:3px}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:700}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:7px 14px;font-weight:700;font-size:12px;background:var(--card2);border:1px solid var(--linha2);white-space:nowrap}
.btn:hover{border-color:var(--mut2)}
.btn.pr{background:var(--acc);color:var(--acc-tx);border-color:var(--acc)}
.btn.pr:hover{filter:brightness(1.07)}
.btn.gh{background:none}
.btn.dg{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:none}
.btn.dg.arm{background:var(--bad);color:#fff}
.btn.s{padding:4px 10px;font-size:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;border:1px solid var(--linha);color:var(--mut);background:var(--card)}
.tab.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.tab .n{opacity:.6;margin-left:4px;font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--card3);color:var(--mut);white-space:nowrap}
.tag.acc{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.tag.mar{background:color-mix(in srgb,var(--acc2) 16%,transparent);color:var(--acc2)}
.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.tag.lil{background:color-mix(in srgb,var(--lil) 16%,transparent);color:var(--lil)}
.tag.gold{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
.empty{padding:26px 14px;text-align:center;color:var(--mut);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:12px 14px;text-align:left;position:relative;overflow:hidden}
.kpi .eyebrow{font-size:9.5px}
.kpi .v{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:11px;color:var(--mut)}
.kpi.hl{background:var(--acc);border-color:var(--acc);color:var(--acc-tx)}
.kpi.hl .eyebrow,.kpi.hl .d{color:inherit;opacity:.75}
.bar{height:6px;border-radius:99px;background:var(--card3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.kpi.hl .bar{background:rgba(0,0,0,.18)}.kpi.hl .bar i{background:var(--acc-tx)}

/* tabela */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--linha);white-space:nowrap;position:sticky;top:0;background:var(--card)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--linha);vertical-align:middle}
.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover td{background:var(--card2)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td.num,.tbl td.r{white-space:nowrap}
.tw{overflow:auto;max-width:100%}
.who{display:flex;align-items:center;gap:9px;min-width:0}
.who b{display:block;font-weight:700;font-size:12.5px}
.who span{font-size:11px;color:var(--mut)}

/* stepper */
.stp{display:flex;align-items:center;gap:0;min-width:220px}
.stp i{width:9px;height:9px;border-radius:99px;border:1.5px solid var(--linha2);background:var(--card);flex:none}
.stp i.d{background:var(--acc);border-color:var(--acc)}
.stp i.c{background:var(--bg);border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.stp u{flex:1;height:1.5px;background:var(--linha2);min-width:8px}
.stp u.d{background:var(--acc)}
.stpl{display:flex;justify-content:space-between;font-size:9px;color:var(--mut2);margin-top:3px;gap:2px}
.stpl span.c{color:var(--acc);font-weight:700}

/* banner */
.hero{position:relative;border-radius:20px;overflow:hidden;min-height:210px;background:#111 center 62%/cover;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 24px;color:#fff;border:1px solid var(--linha)}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(6,8,14,.92) 0%,rgba(6,8,14,.65) 45%,rgba(6,8,14,.1) 100%)}
.hero>*{position:relative}
.hero .eyebrow{color:rgba(255,255,255,.75)}
.hero h1{font-family:var(--fd);font-weight:400;font-size:44px;line-height:1;letter-spacing:-.01em;margin:8px 0 6px}
.hero h1 em{color:var(--acc);font-style:italic}
.hero p{color:rgba(255,255,255,.78);max-width:460px;font-size:12.5px}
.hero .row{margin-top:12px}
.hero .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff;backdrop-filter:blur(6px)}
.hero .btn.pr{background:var(--acc);border-color:var(--acc);color:var(--acc-tx)}

/* listas de tarefas (Hoje) */
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tsec{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;min-width:0}
.tsec h4{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;margin-bottom:6px}
.tsec h4 .c{margin-left:auto;font-size:11px;font-weight:800;border-radius:99px;padding:1px 8px;background:var(--card3)}
.tsec h4 .c.hot{background:var(--acc);color:var(--acc-tx)}
.titem{display:flex;align-items:center;gap:9px;padding:7px 4px;border-top:1px solid var(--linha);text-align:left;width:100%;min-width:0}
.titem:first-of-type{border-top:0}
.titem:hover{background:var(--card2);border-radius:8px}
.titem .tx{flex:1;min-width:0}
.titem .tx b{display:block;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem .tx span{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem .qa{flex:none}
.more{font-size:11.5px;color:var(--mut);padding:6px 4px 0;text-align:left}

/* assistente */
.assist{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 22%,var(--card)) 0%,var(--card) 70%);border:1px solid color-mix(in srgb,var(--acc) 35%,var(--linha))}
.assist .eyebrow{color:var(--acc)}
.sug{display:flex;gap:9px;padding:8px 0;border-top:1px solid var(--linha);align-items:flex-start}
.sug:first-of-type{border-top:0}
.sug .ico{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--card3);flex:none;color:var(--acc)}
.sug p{font-size:12px;line-height:1.35}
.sug .row{margin-top:5px}

/* funil */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:212px;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:start}
.bcol{background:var(--bg2);border:1px solid var(--linha);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:7px;min-height:120px;max-height:calc(100vh - 230px);overflow-y:auto}
.bcol.dragover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--bg2))}
.bcol h5{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 4px 2px;position:sticky;top:-8px;background:var(--bg2);z-index:1}
.bcol h5 .n{color:var(--mut);font-weight:700}
.bcol h5 .v{margin-left:auto;font-size:10.5px;color:var(--mut)}
.bcol h5 .dt{width:7px;height:7px;border-radius:99px}
.bcard{background:var(--card);border:1px solid var(--linha);border-radius:11px;padding:9px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.bcard:hover{border-color:var(--linha2)}
.bcard b{font-size:12.5px;font-weight:700}
.bcard .mt{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--mut)}
.bcard.sug{border-style:dashed;background:none}
.bcard[draggable=true]{cursor:grab}

/* creators grid */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:10px}
.ccard{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.ccard:hover{border-color:var(--linha2)}
.ccard .nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:10.5px;color:var(--mut);white-space:nowrap}
.ccard .nums b{color:var(--tx);font-size:13px;display:block}
.cav{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;color:#fff}

/* modal / drawer */
.ov{position:fixed;inset:0;z-index:60;background:rgba(3,4,8,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;justify-content:flex-end}
.ov.center{justify-content:center;align-items:flex-start;padding:5vh 16px}
.drawer{width:min(760px,100%);height:100%;background:var(--bg2);border-left:1px solid var(--linha2);display:flex;flex-direction:column;animation:sin .18s ease-out}
.modal{width:min(640px,100%);max-height:90vh;background:var(--bg2);border:1px solid var(--linha2);border-radius:18px;display:flex;flex-direction:column;animation:pop .16s ease-out;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal.wide{width:min(900px,100%)}
@keyframes sin{from{transform:translateX(30px);opacity:.4}}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:.5}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.shake{animation:shake .35s}
.dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--linha)}
.dh h2{font-size:16px;font-weight:800;line-height:1.15}
.dh .sub{font-size:11.5px;color:var(--mut)}
.db{flex:1;overflow-y:auto;padding:16px 18px 24px;display:flex;flex-direction:column;gap:14px}
.df{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--linha);flex-wrap:wrap}
.sec{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:12px 14px}
.sec>h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut2);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec>h4 .sp{flex:1}
.sec>h4 .btn,.sec>h4 .tag{text-transform:none;letter-spacing:0}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 16px}
.kv>div{min-width:0}
.kv>div>span{display:block;font-size:10.5px;color:var(--mut2)}
.kv b{display:block;font-weight:600;font-size:12.5px;overflow-wrap:anywhere}
.kv .full{grid-column:1/-1}

/* formulários */
.frm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.frm .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>label{font-size:10.5px;color:var(--mut);font-weight:600;letter-spacing:.02em}
.fld>label i{color:var(--acc);font-style:normal}
.fld input:not([type=checkbox]):not([type=radio]),.fld select,.fld textarea,.inp{width:100%;background:var(--card);border:1px solid var(--linha2);border-radius:10px;padding:8px 10px;outline:0;font-size:12.5px;min-height:36px}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{border-color:var(--acc)}
.fld.err input,.fld.err select,.fld.err textarea{border-color:var(--bad)}
.fld .hint{font-size:10.5px;color:var(--mut2)}
.fld .conf{font-size:10.5px;color:var(--acc2)}
.pchips{display:flex;flex-wrap:wrap;gap:5px}
.pch{border:1px solid var(--linha2);border-radius:99px;padding:5px 10px;font-size:11.5px;font-weight:600;background:var(--card);min-height:30px}
.pch.on{background:var(--acc);border-color:var(--acc);color:var(--acc-tx)}
.pick input.pin2{margin-top:2px}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--acc)}
.cl{display:flex;flex-direction:column}
.cl label{display:flex;align-items:center;gap:9px;padding:7px 2px;border-top:1px solid var(--linha);font-size:12.5px;cursor:pointer}
.cl label:first-child{border-top:0}
.cl input{width:16px;height:16px;accent-color:var(--acc)}
.cl .by{margin-left:auto;font-size:10.5px;color:var(--mut2)}
.cl label.done span{color:var(--mut);text-decoration:line-through}

/* timeline */

let toastT;
function toast(msg, err) { let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t) } t.className = "toast" + (err ? " err" : ""); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, err ? 4200 : 2400) }
const msgErro = e => { const m = e?.message || String(e); if (/row-level security|permission/i.test(m)) return "Seu perfil não tem permissão para isso."; if (/fetch|network/i.test(m)) return "Sem conexão. Tente de novo."; return m };

/* ---------- dados ---------- */
async function fetchAll(t, cols = "*") {
  let out = [], from = 0;
  for (;;) {
    const { data, error } = await db.from(t).select(cols).range(from, from + 999);
    if (error) { S.erros[t] = error.message; console.warn(t, error); break }
    out = out.concat(data || []);
    if (!data || data.length < 1000) break;
    from += 1000;
  }
  return out;
}
async function load() {
  const lista = Object.keys(T).filter(t => !(t === "impd_creator_priv" && !podeSens()) && !(t === "impd_lanc" && !podeSens()));
  const cols = { impd_anexos: "id,ref_tipo,ref_id,nome,mime,tamanho,url,criado_por,created_at" };
  const res = await Promise.all(lista.map(t => fetchAll(t, cols[t] || "*")));
  lista.forEach((t, i) => S[T[t]] = res[i]);
  S.interacoes.sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
  reindex(); S.carregado = true;
}
function putLocal(t, row) { const k = T[t], pk = PK(t); const i = S[k].findIndex(r => r[pk] === row[pk]); if (i >= 0) S[k][i] = { ...S[k][i], ...row }; else S[k].unshift(row); S.idx[k].set(row[pk], i >= 0 ? S[k][i] : row) }
async function save(t, row, id) {
  const now = new Date().toISOString();
  if (id && ["impd_marcas", "impd_negocios", "impd_creators", "impd_campanhas", "impd_jobs", "impd_propostas", "impd_contratos", "impd_modelos"].includes(t)) row.updated_at = now;
  const q = id ? db.from(t).update(row).eq("id", id) : db.from(t).insert(row);
  const { data, error } = await q.select().single();
  if (error) { toast(msgErro(error), 1); throw error }
  putLocal(t, data); return data;
}
async function savePriv(row) {
  row.updated_at = new Date().toISOString();
  const { data, error } = await db.from("impd_creator_priv").upsert(row, { onConflict: "creator_id" }).select().single();
  if (error) { toast(msgErro(error), 1); throw error }
  putLocal("impd_creator_priv", data); return data;
}
async function apagar(t, id) {
  const { error } = await db.from(t).delete().eq("id", id);
  if (error) { toast(msgErro(error), 1); throw error }
  const k = T[t]; S[k] = S[k].filter(r => r.id !== id); S.idx[k].delete(id);
}
async function log(ref_tipo, ref_id, texto, tipo = "sistema", marca_id = null) {
  try { await save("impd_interacoes", { ref_tipo, ref_id, texto, tipo, marca_id, autor: S.me?.nome || S.email }) } catch (e) { }
}
async function bulkInsert(t, rows) {
  const out = [];
  for (let i = 0; i < rows.length; i += 400) {
    const { data, error } = await db.from(t).insert(rows.slice(i, i + 400)).select();
    if (error) { toast(msgErro(error), 1); throw error }
    out.push(...(data || []));
  }
  out.forEach(r => putLocal(t, r)); return out;
}

const STACK = [];
function openM({ title, sub = "", body = "", foot = "", wide = false, drawer = false, render = null, key = null, onMount = null, onClose = null }) {
  if (key) { const ex = STACK.find(x => x.key === key); if (ex) closeM(ex, true) }
  const ov = document.createElement("div");
  ov.className = "ov" + (drawer ? "" : " center");
  ov.innerHTML = `<div class="${drawer ? "drawer" : "modal" + (wide ? " wide" : "")}" role="dialog">
    <div class="dh"><div class="sp" style="min-width:0"><h2 class="dt"></h2><div class="sub ds"></div></div>
      <button class="btn s gh" data-close>${ic("x")} Fechar</button></div>
    <div class="db"></div><div class="df" hidden></div></div>`;
  document.body.appendChild(ov);
  const box = ov.firstElementChild;
  const m = { ov, box, key, render, onClose, dirty: false, armed: false };
  m.set = (o) => {
    if (o.title != null) $(".dt", box).innerHTML = o.title;
    if (o.sub != null) $(".ds", box).innerHTML = o.sub;
    if (o.body != null) { const b = $(".db", box), st = b.scrollTop; b.innerHTML = o.body; b.scrollTop = st }
    if (o.foot != null) { const f = $(".df", box); f.innerHTML = o.foot; f.hidden = !o.foot }
  };
  m.refresh = () => {
    if (!m.render) return;
    const keep = $$("textarea, input.inp", box).map(t => [t.closest("[data-intbox]")?.dataset.intbox || t.id || null, t.value]).filter(x => x[0] && x[1]);
    m.set(m.render()); m.onMount?.(m);
    keep.forEach(([k, v]) => { const t = $(`[data-intbox="${k}"] textarea`, box) || (document.getElementById(k)); if (t && box.contains(t)) t.value = v });
  };
  m.onMount = onMount;
  if (render) m.set(render()); else m.set({ title, sub, body, foot });
  ov.addEventListener("mousedown", e => { if (e.target === ov) { box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake") } });
  box.addEventListener("input", e => { if (e.target.type === "checkbox" || e.target.type === "radio" || e.target.closest(".pchips")) return; m.dirty = true });
  $("[data-close]", box).onclick = () => closeM(m);
  STACK.push(m); onMount?.(m);
  setTimeout(() => { const f = $("input:not([type=hidden]):not([type=checkbox]),textarea", $(".db", box)); if (f && !drawer && innerWidth > 860) f.focus() }, 40);
  return m;
}
function closeM(m, force) {
  m = m || STACK[STACK.length - 1]; if (!m) return;
  if (!force && m.dirty) {
    const b = $("[data-close]", m.box);
    if (!m.armed) { m.armed = true; b.innerHTML = "Fechar sem salvar?"; b.classList.add("dg", "arm"); setTimeout(() => { if (m.armed) { m.armed = false; b.innerHTML = ic("x") + " Fechar"; b.classList.remove("dg", "arm") } }, 3000); return }
  }
  m.ov.remove(); const i = STACK.indexOf(m); if (i >= 0) STACK.splice(i, 1); m.onClose?.();
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && STACK.length) { const b = STACK[STACK.length - 1].box; b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake") } });

/* ---------- campos de formulário ---------- */
function fld(name, label, val, o = {}) {
  const v = val ?? "", req = o.req ? " <i>*</i>" : "", cls = "fld" + (o.full ? " full" : "");
  let inp;
  if (o.type === "textarea") inp = `<textarea name="${name}" placeholder="${esc(o.ph || "")}" ${o.rows ? `rows="${o.rows}"` : ""}>${esc(v)}</textarea>`;
  else if (o.type === "select") inp = `<select name="${name}">${(o.opts || []).map(x => { const [vv, tt] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(vv)}" ${String(vv) === String(v) ? "selected" : ""}>${esc(tt)}</option>` }).join("")}</select>`;
  else if (o.type === "date") inp = `<input type="date" name="${name}" value="${esc(String(v).slice(0, 10))}" data-dconf><div class="conf">${v ? "→ " + fdl(v) : ""}</div>`;
  else inp = `<input name="${name}" type="${o.type || "text"}" value="${esc(v)}" placeholder="${esc(o.ph || "")}" ${o.num ? 'inputmode="decimal"' : ""} ${o.list ? `list="${o.list}"` : ""} autocomplete="off">`;
  return `<div class="${cls}" data-f="${name}"><label>${label}${req}</label>${inp}${o.hint ? `<div class="hint">${o.hint}</div>` : ""}</div>`;
}
/* Padrão Tae: botões com as opções mais comuns + campo livre */

  ${o.type === "date" ? `<input type="date" name="${name}" value="${esc(String(v).slice(0, 10))}" class="pin2" data-dconf><div class="conf">${v ? "→ " + fdl(v) : ""}</div>` : `<input name="${name}" value="${esc(String(v))}" placeholder="${esc(o.ph || "Outro: escreva aqui")}" ${o.num ? 'inputmode="decimal"' : ""} class="pin2" autocomplete="off">`}</div>`;

/* múltipla escolha (chips) + campo livre separado por vírgula */

function busca() {
  const q = $("#q"), box = $("#sres"); let hl = 0, res = [];
  const run = () => {
    const t = norm(q.value); if (t.length < 2) { box.hidden = true; return }
    const has = (...xs) => xs.some(x => norm(x).includes(t));
    res = [
      ...S.marcas.filter(m => has(m.nome, m.instagram, m.contato_nome)).slice(0, 6).map(m => ["Marca", m.nome, m.segmento || "", "marca:" + m.id]),
      ...S.creators.filter(c => has(c.nome, c.nome_artistico, c.instagram, c.tiktok)).slice(0, 6).map(c => ["Creator", c.nome, arroba(c.instagram), "creator:" + c.id]),
      ...S.campanhas.filter(c => has(c.nome, c.codigo)).slice(0, 5).map(c => ["Campanha", c.nome, c.codigo, "campanha:" + c.id]),
      ...S.negocios.filter(n => has(n.codigo, n.titulo) || has(marcaDe(n)?.nome)).slice(0, 4).map(n => ["Negócio", (marcaDe(n)?.nome || "") + " · " + (n.titulo || ""), n.codigo, "negocio:" + n.id]),
      ...S.propostas.filter(p => has(p.numero, p.titulo)).slice(0, 3).map(p => ["Proposta", p.titulo || p.numero, p.numero, "proposta:" + p.id]),
      ...S.contatos.filter(c => has(c.nome, c.contato, c.empresa)).slice(0, 4).map(c => ["Contato", c.nome, c.contato || "", "contato:" + c.id]),
    ];
    hl = 0;
    box.innerHTML = res.length ? res.map((r, i) => `<button data-open="${r[3]}" class="${i === 0 ? "hl" : ""}"><span class="tg">${r[0]}</span><span class="ell sp"><b>${esc(r[1])}</b> <span class="mut sm">${esc(r[2])}</span></span></button>`).join("") : `<div class="empty">Nada encontrado para “${esc(q.value)}”.</div>`;
    box.hidden = false;
  };
  q.addEventListener("input", run);
  q.addEventListener("keydown", e => { const bs = $$("button", box); if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); hl = (hl + (e.key === "ArrowDown" ? 1 : -1) + bs.length) % bs.length; bs.forEach((b, i) => b.classList.toggle("hl", i === hl)) } if (e.key === "Enter" && bs[hl]) bs[hl].click(); if (e.key === "Escape") { box.hidden = true; q.blur() } });
  box.addEventListener("click", () => { box.hidden = true; q.value = "" });
  document.addEventListener("click", e => { if (!e.target.closest(".srch")) box.hidden = true });
}

function ckOk(j, k) {
  const ck = j.checklist || {};
  if (j.status === "concluido") return true;
  if (k === "publicado") return !!j.publicado_em;
  if (k === "metricas") return !!j.link_metricas || !!ck.metricas?.ok;
  if (k === "recebido") return !!j.recebido_em;
  if (k === "repasse") return !!j.repasse_feito_em || (j.valor_creator === 0);
  if (k === "nf") return ["emitida", "repassada", "sem_nota"].includes(j.nf_status) || !!ck.nf?.ok;
  return !!ck[k]?.ok;
}
function etapaJob(j) {
  if (j.status === "concluido") return "finalizado";
  const ck = j.checklist || {};
  let d = "briefing";
  if (ck.briefing?.ok || ck.produto?.ok || ck.roteiro?.ok) d = "producao";
  if (ck.conteudo?.ok) d = "aprovacao";
  if (ck.aprovado?.ok) d = "agendado";
  if (j.publicado_em) d = "publicado";
  if (j.link_metricas || ck.metricas?.ok) d = "metricas";
  const ix = e => ETAPAS_JOB.findIndex(x => x[0] === e);
  const s = j.etapa === "ajuste" ? "aprovacao" : j.etapa;
  return ix(s) > ix(d) ? s : d;
}

function etapaColuna(n) {
  if (n.status === "cancelado") return null;
  if (n.etapa !== "fechado") return n.etapa;
  const cs = S.campanhas.filter(c => c.negocio_id === n.id);

  if (cs.some(c => c.status === "ativa" || c.status === "standby")) return "campanha";

}
function ultimaCampanha(marcaId) { return S.campanhas.filter(c => c.marca_id === marcaId && c.status !== "cancelada").sort((a, b) => String(b.fim || b.inicio).localeCompare(String(a.fim || a.inicio)))[0] }
const negAberto = marcaId => S.negocios.some(n => n.marca_id === marcaId && n.status !== "cancelado" && !["fechado", "perdido"].includes(n.etapa));
const campAtiva = marcaId => S.campanhas.some(c => c.marca_id === marcaId && (c.status === "ativa" || c.status === "standby"));
function jobsDaMarca(marcaId) { const cs = new Set(S.campanhas.filter(c => c.marca_id === marcaId).map(c => c.id)); return S.jobs.filter(j => cs.has(j.campanha_id)) }
function statsMarca(m) {
  const js = jobsDaMarca(m.id).filter(j => j.status !== "cancelado");
  const camps = S.campanhas.filter(c => c.marca_id === m.id && c.status !== "cancelada");
  const bruto = soma(js, j => j.valor_bruto), ag = soma(js, j => j.valor_agencia);

  const perd = abertos.filter(n => n.etapa === "perdido" && (n.updated_at || "").slice(0, 10) >= d90);

  const j12 = S.jobs.filter(j => j.status !== "cancelado" && (j.data_formalizacao || "") >= meses[0] + "-01");
  const rk = (f, val) => { const o = {}; j12.forEach(j => { const key = f(j); if (key) o[key] = (o[key] || 0) + (val(j) || 0) }); return Object.entries(o).sort((a, b) => b[1] - a[1]) };
  const topM = rk(j => marcaDe(campDe(j))?.nome, j => j.valor_bruto).slice(0, 8);

   ${kpi("Conversão (90 dias)", conv + "%", fech + " fechados · " + perd.length + " perdidos")}
   ${kpi("A receber em aberto", brlk(soma(aRec, j => j.valor_bruto)), aRec.length + " jobs", { go: "financeiro" })}

   ${kpi("Jobs em andamento", S.jobs.filter(ativoJob).length, brlk(soma(S.jobs.filter(ativoJob), j => j.valor_bruto)) + " em execução", { go: "campanhas" })}
  </div>
  <div class="card"><div class="ch"><h3>Faturamento × comissão · 12 meses</h3><span class="lk"><span class="tag">bruto</span> <span class="tag acc">comissão</span></span></div>

function extenso(v) {

  const int = Math.floor(v), cent = Math.round((v - int) * 100); const mi = Math.floor(int / 1e6), mil = Math.floor(int % 1e6 / 1000), r = int % 1000; const p = [];
  if (mi) p.push(ate999(mi) + (mi > 1 ? " milhões" : " milhão")); if (mil) p.push(mil === 1 ? "mil" : ate999(mil) + " mil"); if (r) p.push(ate999(r));

async function renderPublico(slug) {
  document.documentElement.dataset.tema = "areia";

  if (error || !f || !f.ativo) { $("#app").innerHTML = `<div class="pub"><div class="card"><div class="logo">IMP <span class="dg">digital</span></div><h2 style="margin:14px 0 6px">Formulário indisponível</h2><p class="mut">Este link não está mais aberto. Fale com a equipe da IMP Digital.</p></div></div>`; return }
  document.title = f.titulo + " · IMP Digital";
  const campo = c => { const r = c.obrig ? { req: 1 } : {}; const nm = "c_" + c.k;
    if (c.tipo === "longo") return fld(nm, esc(c.label), "", { type: "textarea", full: 1, ...r });
    if (c.tipo === "numero") return fld(nm, esc(c.label), "", { num: 1, full: 1, ...r });
    if (c.tipo === "data") return fld(nm, esc(c.label), "", { type: "date", full: 1, ...r });
    if (c.tipo === "opcao") return pick(nm, esc(c.label), "", c.opcoes || [], { full: 1, ...r, ph: "Outra: escreva aqui" });
    if (c.tipo === "multi") return multi(nm, esc(c.label), [], c.opcoes || [], { full: 1 });
    return fld(nm, esc(c.label), "", { full: 1, ...r }) };
  $("#app").innerHTML = `<div class="pub"><div class="logo" style="margin-bottom:18px">IMP <span class="dg">digital</span> <span class="rj">RJ</span></div><div class="card"><h1 style="font-family:var(--fd);font-weight:400;font-size:34px;line-height:1.05">${esc(f.titulo)}</h1>${f.descricao ? `<p class="mut" style="margin:8px 0 16px">${esc(f.descricao)}</p>` : ""}<form id="pf" class="frm">${(f.campos || []).map(campo).join("")}<div class="full"><button class="btn pr" style="width:100%;justify-content:center;padding:12px">Enviar</button></div></form></div><p class="xs mut2" style="text-align:center;margin-top:14px">IMP Digital · Charitas, Niterói/RJ</p></div>`;

    $(".pub .card").innerHTML = `<h1 style="font-family:var(--fd);font-weight:400;font-size:34px">Recebido ✦</h1><p class="mut" style="margin-top:8px">Obrigado! A equipe da IMP Digital vai retornar em breve.</p>`;
  };
}

function pessoasDados() {
  const raw = [...S.campanhas.flatMap(c => [c.resp, c.atendimento]), ...S.negocios.map(n => n.resp), ...S.creators.map(c => c.assessor), ...S.marcas.map(m => m.resp), ...S.membros.filter(m => m.status !== "pendente").map(m => m.nome)].map(x => String(x || "").trim()).filter(Boolean);
  const grupos = [];
  raw.forEach(n => { let g = grupos.find(g => mesmo(g.nome, n)); if (!g) grupos.push(g = { nome: n }); else if (palavras(n).length > palavras(g.nome).length) g.nome = n });
  const d12 = addD(-365);
  return grupos.map(g => ({ ...g, membro: S.membros.find(m => m.status !== "pendente" && mesmo(m.nome, g.nome)),
    camps: S.campanhas.filter(c => mesmo(c.resp, g.nome) || mesmo(c.atendimento, g.nome)).length,
    negs: S.negocios.filter(n => mesmo(n.resp, g.nome) && n.status !== "cancelado" && !["fechado", "perdido"].includes(n.etapa)).length,
    cart: S.creators.filter(c => mesmo(c.assessor, g.nome) && c.tipo !== "avaliacao").length,
    fat: soma(S.jobs.filter(j => j.status !== "cancelado" && (j.data_formalizacao || "") >= d12 && mesmo(campDe(j)?.resp, g.nome)), j => j.valor_bruto) }))
    .sort((a, b) => b.fat - a.fat || b.camps - a.camps || a.nome.localeCompare(b.nome));
}

ACT.membroSalvar = async () => { const m = STACK[STACK.length - 1]; if (!exigir(m.box, [["nome", "Escreva o nome"], ["email", "Escreva o e-mail"]])) return; const f = readForm(m.box); f.email = f.email.toLowerCase(); if (!PAPEIS[f.papel]) return toast("Escolha um dos perfis", 1); if (!m.mid) { if (S.membros.some(x => x.email === f.email)) return toast("Esse e-mail já está na equipe", 1); f.status = "ativo" } await save("impd_membros", f, m.mid); closeM(m, true); toast("Salvo ✓"); refreshAll() };

/* ---------- início ---------- */
(function start() {
  const slug = new URLSearchParams(location.search).get("f");
  if (slug) renderPublico(slug); else boot();
})();
